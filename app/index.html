<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <title>Angularians</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Everyone who has contributed to Angular since 2014, ranked: merged pull requests, issues, comments and code reviews. A community project." />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Erkam Yaman" />
    <link rel="author" href="https://erkamyaman.dev" />
    <!-- The brand font, early: the word "Angularians" is in the header of every page, and would jump on a late swap -->
    <link rel="preload" href="/fonts/Norse-Bold.otf" as="font" type="font/otf" crossorigin />
    <!-- The text font (Manrope, Latin), early too: found only in the stylesheet, it would swap in after the first paint and move the lines -->
    <link rel="preload" href="./node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Every page shows GitHub avatars, the profile's first: the connection opens while the page loads. -->
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />
    <!-- ?v=: a new address when the mark changes, or browsers keep showing their cached icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#09090b" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (function () {
        var navigation = performance.getEntriesByType && performance.getEntriesByType('navigation')[0]
        if (!navigation || (navigation.type !== 'reload' && navigation.type !== 'back_forward')) return
        var expect = document.createElement('link')
        expect.rel = 'expect'
        expect.href = location.pathname + location.search + '#site-footer'
        expect.setAttribute('blocking', 'render')
        document.head.appendChild(expect)
      })()
    </script>
    <!-- Before the first paint: dark (the class above), or a saved light theme. Same key as ThemeService. -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        try { if (localStorage.getItem('angularians-graph-colors') === 'green') document.documentElement.classList.add('graph-green') } catch (e) {}
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0078eeb1cf95440094d37a28f24393ee"}'></script>
  </body>
</html>
