<app-container class="grid items-center gap-8 pt-8 pb-10 sm:gap-10 sm:pt-24 sm:pb-16 lg:grid-cols-2 lg:gap-16">
  <div>
    <ng-content select="[heroHeadline]" />
    <h1 class="text-4xl font-medium tracking-tight text-balance sm:text-5xl">
      <ng-content select="[heroTitle]" />{{ title() }}
    </h1>
    @if (description()) {
      <p class="mt-4 max-w-2xl text-base text-pretty text-muted-foreground sm:mt-5 sm:text-lg">{{ description() }}</p>
    }
    <!-- Or a description with markup (a logo, a highlighted word) -->
    <p class="mt-4 max-w-2xl text-base text-pretty text-muted-foreground empty:hidden sm:mt-5 sm:text-lg"><ng-content select="[heroDescription]" /></p>
    <!-- Phones: one column of full-width buttons (hlm-dialog wraps a trigger) -->
    <div class="mt-6 grid gap-2.5 empty:hidden sm:mt-8 sm:gap-3 sm:flex sm:flex-wrap [&_[hlmdialogtrigger]]:max-sm:w-full"><ng-content select="[heroActions]" /></div>
    <ng-content />
  </div>
  <ng-content select="[heroAside]" />
</app-container>
