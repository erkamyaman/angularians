<app-container class="flex h-16 items-center gap-4">
  <a routerLink="/" class="logo-link flex items-center gap-1 font-semibold tracking-tight" (click)="toTop()">
    <app-logo-mark class="size-8" />
    <span class="brand text-[1.55em] text-brand">Angularians</span>
  </a>
  <nav class="ml-auto flex items-center gap-1" aria-label="Site">
    <!-- As on ngprimitives.com: sponsor first, a divider, then the icons. On phones the heart alone. -->
    <a class="mr-1 inline-flex h-9 items-center gap-2 rounded-md px-2 text-sm text-muted-foreground hover:bg-muted hover:text-foreground"
      [href]="sponsorUrl" target="_blank" rel="noopener" aria-label="Sponsor Angularians" title="Sponsor Angularians">
      <ng-icon name="remixHeartLine" aria-hidden="true" /><span class="max-sm:hidden">Sponsor</span>
    </a>
    <span class="mr-1 h-5 w-px bg-border" aria-hidden="true"></span>
    <!-- GitHub and the theme always; then, signed in, the avatar and its menu -->
    <app-github-stars />
    <app-theme-toggle />
    @if (avatarSlot()) {
      <!-- The avatar's place, drawn by the server for a visitor signed in last time and kept for the whole visit, so
           the icons beside it never move: the avatar, its skeleton while the session loads, or, the session over, the
           sign-in -->
      <span class="grid size-9 place-items-center">
        @if (signedIn()) {
          <app-user-menu />
        } @else if (restoringSession()) {
          <span class="size-7 animate-pulse rounded-full bg-muted" aria-hidden="true"></span>
        } @else if (signInEnabled()) {
          <a hlmBtn variant="ghost" size="icon" [href]="loginUrl()" aria-label="Sign in with GitHub" title="Sign in with GitHub">
            <ng-icon name="remixLoginBoxLine" aria-hidden="true" />
          </a>
        }
      </span>
    }
  </nav>
</app-container>
