@if (strike(); as strike) {
  <div class="sky"></div>
  <svg class="bolt">
    @for (branch of strike.branches; track $index) {
      <path class="branch glow" [attr.d]="branch" pathLength="1" />
      <path class="branch core" [attr.d]="branch" pathLength="1" />
    }
    <path class="main glow" [attr.d]="strike.main" pathLength="1" />
    <path class="main core" [attr.d]="strike.main" pathLength="1" />
  </svg>
  <span class="impact" [style.left.px]="strike.x" [style.top.px]="strike.y"></span>
  <img class="angie" src="/angie/angie-hammer.png" alt="" width="360" height="360" (animationend)="end()" />
}
