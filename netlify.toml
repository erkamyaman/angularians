# Netlify: the Analog app in app/, server-rendered by one function (Nitro's netlify preset).
[build]
  command = "pnpm --filter @angularians/app build"
  # Paths are from the repository root (the site's base directory).
  # Static assets (JS, CSS, favicon) are served by the CDN...
  publish = "app/dist/analog/public"
  # ...and every other path by the server function. On Netlify (NETLIFY=true) Analog writes it to
  # app/netlify/functions/server, not dist/analog/server (see app/scripts/netlify-function.ts).
  functions = "app/netlify/functions"
  # Skip the build when nothing the site is built from changed: docs, Markdown, agent skills and GitHub config.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!*.md' ':!.agents' ':!.github'"

# The Netlify address to the real one at the CDN, before any function runs: each function call counts against a monthly limit.
[[redirects]]
  from = "https://angularians.netlify.app/*"
  to = "https://angularians.dev/:splat"
  status = 301
  force = true

[build.environment]
  # 24: the collector and the build scripts run TypeScript directly (type stripping).
  NODE_VERSION = "24"
  NITRO_PRESET = "netlify"

# The brand font never changes: browsers keep it a year (the CDN serves static files itself, not the server).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed file names: a changed file gets a new name, so browsers keep these a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Flags keep their names but almost never change: browsers keep them 30 days.
[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
