name: Recognition request
description: Ask for the Angular GDE, GitHub Star or Nx Champion badge on an Angularians profile
title: "Recognition: "
labels: [recognition, needs triage]
body:
  - type: input
    id: username
    attributes:
      label: GitHub username
      description: The profile on Angularians, angularians.dev/<username>.
      placeholder: angie
    validations:
      required: true
  - type: dropdown
    id: recognition
    attributes:
      label: Recognition
      options:
        - Angular GDE
        - GitHub Star
        - Nx Champion
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official profile
      description: The page on g.dev/experts (Angular specialization), stars.github.com or nx.dev/community that shows it.
      placeholder: https://g.dev/...
    validations:
      required: true
