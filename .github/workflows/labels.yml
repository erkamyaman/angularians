# The repository's labels, from .github/labels.json: created, or updated in colour and description. Labels that are
# not in the file are left alone. Runs when the file changes on main, or by hand from the Actions tab.
name: Labels

on:
  push:
    branches: [main]
    paths: [.github/labels.json, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update the labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r .name <<< "$label")
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --force \
              --color "$(jq -r .color <<< "$label")" --description "$(jq -r .description <<< "$label")"
            echo "Label: $name"
          done
