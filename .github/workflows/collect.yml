name: collect

on:
  schedule:
    # Nightly, off the hour (runs at :00 are often delayed).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Test run: only activity since then (e.g. 30d or 2026-10-01). Uploads the files as an artifact, commits nothing.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Test runs commit nothing: they need not wait for a full run.
  group: collect-${{ inputs.since && 'test' || 'data' }}
  cancel-in-progress: false

jobs:
  # One job per repository, in parallel: one after the other they take longer than a job may run (angular/angular
  # alone takes about 3 hours). Each request limit is an hour's budget, so the jobs split them:
  # - angular/angular: the GitHub App's own 5,000 an hour (COLLECT_APP_ID, COLLECT_APP_KEY; collector/README.md);
  # - angular/components and angular/angular-cli: the personal token's 5,000 (COLLECT_TOKEN);
  # - angular/dev-infra, angular/domino, angular/zone.js and angular/universal: this repository's built-in token (1,000 shared).
  # Without the App, angular/angular uses COLLECT_TOKEN too. A job that runs out of requests waits for the next hour.
  repo:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      # One repository failing fails the run: the site's data is never published with a repository missing.
      fail-fast: true
      matrix:
        repo: [angular/angular, angular/components, angular/angular-cli, angular/dev-infra, angular/domino, angular/zone.js, angular/universal]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          # 24: runs the TypeScript sources directly (type stripping).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the token
        env:
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
        run: |
          if [ -z "$COLLECT_TOKEN" ]; then
            echo "::error::The COLLECT_TOKEN secret is missing: a fine-grained personal access token with read-only access to public repositories (see collector/README.md)."
            exit 1
          fi
      - name: Collect
        run: pnpm --filter @angularians/collector collect --part --repos=${{ matrix.repo }} --out=${{ runner.temp }}/part ${{ inputs.since && format('--since={0}', inputs.since) || '' }}
        env:
          GITHUB_TOKEN: ${{ (matrix.repo == 'angular/dev-infra' || matrix.repo == 'angular/domino' || matrix.repo == 'angular/zone.js' || matrix.repo == 'angular/universal') && github.token || secrets.COLLECT_TOKEN }}
          COLLECT_APP_ID: ${{ matrix.repo == 'angular/angular' && secrets.COLLECT_APP_ID || '' }}
          COLLECT_APP_KEY: ${{ matrix.repo == 'angular/angular' && secrets.COLLECT_APP_KEY || '' }}
      - id: name
        run: echo "artifact=part-${REPO//\//__}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ matrix.repo }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/part
          retention-days: 3

  # The parts as the site's data, the team and the profiles; committed, or uploaded for a test run.
  merge:
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - name: Merge
        # The repositories in the matrix order: meta.json lists them so.
        run: |
          parts=""
          for repo in angular/angular angular/components angular/angular-cli angular/dev-infra angular/domino angular/zone.js angular/universal; do
            parts="$parts $RUNNER_TEMP/parts/part-${repo//\//__}"
          done
          pnpm --filter @angularians/collector merge ${{ inputs.since && format('--out={0}/test-data', runner.temp) || '' }} $parts
        env:
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN }}
      - name: Upload the test run
        if: inputs.since
        uses: actions/upload-artifact@v7
        with:
          name: test-data
          path: ${{ runner.temp }}/test-data
      - name: Commit the data
        if: ${{ !inputs.since }}
        run: |
          git config user.name 'angularians-collector[bot]'
          git config user.email '352303491+angularians-collector[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m 'chore(data): update contributors'
          # A full run takes hours and main moves meanwhile: take what landed, then push. Only this job writes data/,
          # so the rebase never conflicts. A few tries, in case another push lands in between.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rejected (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1
